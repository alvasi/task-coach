# Pushing a tag v<VERSION> builds Task Coach for Apple silicon and Intel, signs it with the project's
# self-signed identity (not an Apple Developer ID), and publishes TaskCoach.zip and its checksum as a
# GitHub release. The installer at https://alvasi.github.io/task-coach/install.sh downloads the latest one.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number is the commit count

      - name: Check the tag matches VERSION and has release notes
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          test "v$VERSION" = "$GITHUB_REF_NAME"
          mkdir -p build
          awk -v v="## $VERSION" '$0==v {on=1; next} /^## / {on=0} on' CHANGELOG.md > build/notes.md
          test -s build/notes.md

      - name: Import the signing identity
        run: scripts/import-identity.sh

      - name: Build, sign and zip
        run: SIGN_IDENTITY="Task Coach Self-Signed" scripts/build-app.sh --universal --zip

      - name: Check the signature and architectures
        run: |
          # No grep -q: an early exit would break the pipe.
          codesign -dvv build/TaskCoach.app 2>&1 | grep -x "Authority=Task Coach Self-Signed" > /dev/null
          lipo -archs build/TaskCoach.app/Contents/MacOS/TaskCoach | grep -w x86_64 > /dev/null
          lipo -archs build/TaskCoach.app/Contents/MacOS/TaskCoach | grep -w arm64 > /dev/null

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/TaskCoach.zip build/TaskCoach.zip.sha256 \
            --title "Task Coach $VERSION" --notes-file build/notes.md
